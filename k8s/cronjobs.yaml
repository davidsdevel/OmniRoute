# CronJobs de OmniRoute — las 6 tareas periódicas que no consumen las colas
# BullMQ. El worker (Deployment omniroute-worker, kubernetes.yaml) consume las
# 9 colas frecuentes; estas tareas se ejecutan aquí como trabajos únicos
# (one-shot) programados por K8s.
#
# IMPORTANTE: los entrypoints bin/workers/<name>.mjs existen en esta rama;
# aplicar este manifiesto después de que exista la imagen
# davidsdevel/omniroute:latest-worker en Docker Hub.
#
# Convenciones comunes a todos los CronJobs:
#   - concurrencyPolicy: Forbid (nunca dos ejecuciones simultáneas)
#   - restartPolicy: OnFailure + backoffLimit: 1 (sin reintentos infinitos)
#   - Se usa `args` (no `command`): con `command` se sustituiría el ENTRYPOINT
#     de la imagen (check-permissions.sh), que ajusta NODE_OPTIONS según
#     OMNIROUTE_MEMORY_MB y avisa si DATA_DIR no es escribible. Con `args` el
#     ENTRYPOINT corre primero y `exec "$@"` (scripts/check-permissions.sh)
#     reenvía el one-shot correctamente.
#   - Montan el mismo omniroute-pvc (ReadWriteOnce) que el pod web → en un
#     cluster multi-nodo deben programarse en el nodo del pod web
#   - env + envFrom (secretRef omniroute-secrets) requeridos: la base SQLite
#     en DATA_DIR=/app/data está cifrada en reposo (STORAGE_ENCRYPTION_KEY)
#   - Los horarios por defecto derivan de JOB_TICK_MS en
#     src/lib/background/types.ts; ajustables por el operador
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pricing-sync
  namespace: omniroute
spec:
  schedule: "0 4 * * *" # tick por defecto 24h
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pricing-sync
              image: davidsdevel/omniroute:latest-worker
              imagePullPolicy: Always
              args: ["node", "--import", "tsx/esm", "bin/workers/pricing-sync.mjs"]
              env:
                - name: REDIS_URL
                  value: "redis://redis-service:6379"
                - name: QUOTA_STORE_REDIS_URL
                  value: "redis://redis-service:6379"
                - name: QUOTA_STORE_DRIVER
                  value: "redis"
                - name: OMNIROUTE_MEMORY_MB
                  value: "1024"
              envFrom:
                - secretRef:
                    name: omniroute-secrets
              volumeMounts:
                - name: data
                  mountPath: /app/data
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: omniroute-pvc
