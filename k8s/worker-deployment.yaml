# ==========================================
# WORKER: Tareas de fondo (BullMQ) y CronJobs
# ==========================================
#
# IMPORTANTE (ReadWriteOnce): omniroute-worker y los CronJobs de
# k8s/cronjobs.yaml montan el mismo omniroute-pvc que el pod web. En un
# cluster multi-nodo deben programarse en el nodo del pod web. Este cluster
# es de un solo nodo (Traefik + omniroute.davidsdevel.com), por lo que no se
# añade ningún nodeSelector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute-worker
  namespace: omniroute
  labels:
    app: omniroute-worker
spec:
  replicas: 1 # El worker consume las 9 colas frecuentes; los jobs periódicos los lanzan los CronJobs.
  selector:
    matchLabels:
      app: omniroute-worker
  template:
    metadata:
      labels:
        app: omniroute-worker
    spec:
      terminationGracePeriodSeconds: 30 # El worker maneja SIGTERM (bin/worker.mjs)
      containers:
        - name: worker
          image: davidsdevel/omniroute:latest-worker
          imagePullPolicy: Always
          # Sin probes HTTP: el worker no es un servidor HTTP (la healthcheck
          # del runner-base comprueba el servidor web, que aquí no existe).
          # Se confía en restartPolicy: Always + salida no-cero ante errores fatales.
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: QUOTA_STORE_REDIS_URL
              value: "redis://redis-service:6379"
            - name: QUOTA_STORE_DRIVER
              value: "redis"
            - name: OMNIROUTE_MEMORY_MB
              value: "1024"
          # Requerido: el worker abre la base SQLite en DATA_DIR=/app/data
          # (cifrada en reposo); sin STORAGE_ENCRYPTION_KEY del secreto no
          # puede leer la DB compartida con el pod web.
          envFrom:
            - secretRef:
                name: omniroute-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omniroute-pvc
